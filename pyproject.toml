[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-dl"
version = "0.1.0"
description = "Attention U-Net for diabetic retinopathy severity classification"
readme = "README.md"
requires-python = ">=3.9"
# See requirements.txt for why the upper bounds are needed.
dependencies = [
    "tensorflow>=2.12,<2.16",
    "numpy>=1.23,<2",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "pillow>=9.3",
    "opencv-python>=4.7",
    "albumentations>=1.4,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.2"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from a clean checkout without installing the package.
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
